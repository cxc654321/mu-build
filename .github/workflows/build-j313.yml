name: build-j313

# Mu firmware for J313 / MacBookAir10,1 (MacBook Air M1, 2020).
#
# Platform MacBookAirMid2020Pkg, built with stuart + CLANGPDB on Linux. The
# feature set comes from Platform/Features.py via NTASI_MU_DEVICE, which is
# exactly what Tools/mu-build exports, so this image matches the native one.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device from Platform/Features.py DEVICES'
        default: j313
      platform:
        description: 'Platform package'
        default: MacBookAirMid2020Pkg
      target:
        description: 'DEBUG or RELEASE'
        default: DEBUG
  push:
    branches: [ main ]
    paths:
      - 'Platform/MacBookAirMid2020Pkg/**'
      - 'Silicon/Apple/**'
      - 'Platform/Features.py'
      - 'Tools/ui-trace.py'
      - '.github/workflows/build-j313.yml'

permissions:
  contents: read

env:
  DEVICE: ${{ inputs.device || 'j313' }}
  PLATFORM: ${{ inputs.platform || 'MacBookAirMid2020Pkg' }}
  BUILD_TARGET: ${{ inputs.target || 'DEBUG' }}

jobs:
  build:
    name: ${{ inputs.platform || 'MacBookAirMid2020Pkg' }} (${{ inputs.target || 'DEBUG' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Recursive, not stuart_setup's nested init: Silicon/ARM/TIANO and
          # MU_BASECORE carry nested gitlinks (ArmPkg, brotli, libspdm ...).
          # One run with an empty nested ArmPkg made BaseTools report
          # "Invalid file path: ArmPkg/Library/ArmMmuLib/ArmMmuBaseLib.inf"
          # and the OverrideValidation plugin then died on a None path.
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm uuid-dev git ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu acpica-tools
          nasm -v || sudo apt-get install -y nasm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv and install stuart
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install --upgrade -r pip-requirements.txt
          # edk2-pytool-extensions still imports pkg_resources, removed in
          # setuptools 81. Same pin Tools/mu-build applies natively.
          pip install --disable-pip-version-check 'setuptools<81'
          command -v stuart_build

      - name: Export toolchain environment
        run: |
          LLVM_BIN="$(ls -d /usr/lib/llvm-*/bin 2>/dev/null | head -1)"
          echo "CLANGPDB_BIN=${LLVM_BIN}/" >> "$GITHUB_ENV"
          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "GCC_AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "LLVM_BIN=${LLVM_BIN}" >> "$GITHUB_ENV"
          "${LLVM_BIN}/clang" --version | head -2
          iasl -v | head -1

      - name: Resolve feature set
        run: python3 Platform/Features.py --resolve "$DEVICE" "" "" || true

      - name: Check payload layout
        run: |
          echo "== package dirs with ArmPkg =="
          ls -d */ArmPkg */*/ArmPkg 2>/dev/null || echo "(none)"
          echo "== ArmMmuLib in TIANO =="
          ls -l Silicon/ARM/TIANO/ArmPkg/Library/ArmMmuLib/ 2>/dev/null || echo "(missing)"
          echo "== submodule heads =="
          for m in MU_BASECORE Common/MU Common/TIANO Silicon/ARM/TIANO Common/MU_DFCI Common/MU_OEM_SAMPLE mu_feature_debugger; do
            printf '%-24s %s\n' "$m" "$(git -C "$m" rev-parse HEAD 2>/dev/null || echo missing)"
          done

      - name: stuart_setup
        run: |
          source venv/bin/activate
          stuart_setup -c "Platform/$PLATFORM/PlatformBuild.py" \
            TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET

      - name: stuart_update
        run: |
          source venv/bin/activate
          stuart_update -c "Platform/$PLATFORM/PlatformBuild.py" \
            TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET

      - name: Patch ArmExceptionLib to keep the EL0 stack off the image
        run: |
          # ArmExceptionLib puts the EL0 exception stack in the CpuDxe image's
          # .bss (mNewStackBase) and points SP_EL0 at it. On this machine the
          # exception vector's first store (ELR = CpuDxe +0x6A08,
          # "stp x0, x1, [sp, #-256]!") faults on an address a few thousand
          # bytes into that array with its top bits gone, so the handler kills
          # itself before it can report anything.
          #
          # The library already has a heap-allocated variant, used by the J813
          # PMCCNTR work for exactly this reason ("ArmCpuDxe's image data can
          # become read-protected"). Take it unconditionally and see whether
          # the second fault goes away; the handler now also reports whether
          # FAR reconstructs into the image, which says whether this was a
          # mapping problem or a truncated pointer.
          python3 - <<'PY'
          p = "Silicon/ARM/TIANO/ArmPkg/Library/ArmExceptionLib/AArch64/AArch64Exception.c"
          src = open(p).read()
          old = "#if NTASI_J813_PMCCNTR_EMULATION"
          if old in src:
              # Both the declaration and the code that picks the stack are behind
              # this macro; flipping only one leaves mNewStackBase undeclared.
              src = src.replace(old, "#if 1 /* J313: heap-allocated EL0 exception stack */")
              open(p, "w").write(src)
              print("patched:", p)
          else:
              print("pattern not found; ArmExceptionLib unchanged")
          PY

      - name: Instrument the UI chain
        # One boot should say which link of GOP -> SRE -> SWM -> OSK -> THEME
        # -> FrontPage is missing. See Tools/ui-trace.py.
        run: python3 Tools/ui-trace.py

      - name: stuart_build
        id: build
        continue-on-error: true
        env:
          NTASI_MU_DEVICE: ${{ inputs.device || 'j313' }}
          NTASI_MU_WITH: ''
          NTASI_MU_WITHOUT: ''
        run: |
          source venv/bin/activate
          stuart_build -c "Platform/$PLATFORM/PlatformBuild.py" \
            TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET

      - name: Find which module prints the memory type message
        if: always()
        run: |
          set -eu
          echo "== modules containing 'MEMORY TYPE INFORMATION' =="
          found=0
          while IFS= read -r f; do
            if strings -a "$f" | grep -q "MEMORY TYPE INFORMATION"; then
              echo "HIT(memory type): $f"
              found=1
            fi
          done < <(find Build -type f \( -name '*.efi' -o -name '*.dll' \) 2>/dev/null)
          echo "memory-type hits: $found"

          echo "== SWM trace strings in the built window manager =="
          WMDLL=$(find Build -name 'SimpleWindowManagerDxe.dll' 2>/dev/null | head -1)
          echo "swm dll=$WMDLL"
          if [ -n "$WMDLL" ]; then
            strings -a "$WMDLL" | grep -i "SWMTrace\|notifying on SRE" | sort -u | head -12 || true
          fi

          echo "== modules containing 'WARM RESET' =="
          while IFS= read -r f; do
            if strings -a "$f" | grep -q "WARM RESET"; then
              echo "HIT(warm reset): $f"
            fi
          done < <(find Build -type f \( -name '*.efi' -o -name '*.dll' \) 2>/dev/null)

          echo "== which reset libraries ended up in ResetSystemRuntimeDxe =="
          strings -a $(find Build -name 'ResetSystemRuntimeDxe.efi' | head -1) | grep -i "HWRS\|PSCI\|RESET UNSUPPORTED" | head -10 || true

      - name: Disassemble the crash site
        if: always()
        run: |
          set -eu
          OBJDUMP=$(ls /usr/lib/llvm-*/bin/llvm-objdump 2>/dev/null | head -1)
          DLL=$(find Build -name 'ArmCpuDxe.dll' 2>/dev/null | head -1)
          echo "dll=$DLL objdump=$OBJDUMP"
          [ -n "$DLL" ] || exit 0
          "$OBJDUMP" -t "$DLL" | awk 'NF>=5 {print $1, $5}' | sort > /tmp/syms.txt
          python3 - <<'PY'
          target = 0x6A08
          syms = []
          for line in open('/tmp/syms.txt'):
              parts = line.split()
              if len(parts) != 2:
                  continue
              try:
                  addr = int(parts[0], 16)
              except ValueError:
                  continue
              syms.append((addr, parts[1]))
          syms.sort()
          chosen = None
          for addr, name in syms:
              if addr <= target:
                  chosen = (addr, name)
          if chosen:
              print(f"NEAREST SYMBOL {chosen[1]} +0x{target - chosen[0]:x} (at 0x{chosen[0]:x})")
          else:
              print("no symbol below target")
          PY
          "$OBJDUMP" -d --start-address=0x69C0 --stop-address=0x6A40 "$DLL" | tail -50

          echo "== map: symbols around 0x6A08 =="
          MAP=$(find Build -name 'ArmCpuDxe.map' 2>/dev/null | head -1)
          echo "map=$MAP"
          if [ -n "$MAP" ]; then
            grep -E "^ *0000:0000[0-9A-Fa-f]{8}" "$MAP" \
              | awk '{ addr = strtonum("0x" $2); if (addr <= 0x6A08 && addr > 0x5000) print }' \
              | sort -k2 | tail -5
            echo "== map: ArchVectorConfig / RegisterEl0Stack =="
            grep -inE "ArchVectorConfig|RegisterEl0Stack|InitializeCpuExceptionHandlers|AllocatePages" "$MAP" | head -12
          fi

          echo "== does the vector install still use a static array? =="
          "$OBJDUMP" -d "$DLL" | grep -nE "adrp|bl .*AllocatePages|mrs|msr" | sed -n '1,10p' || true

          echo "== every MSR SP_EL0 site, with 14 instructions of context =="
          "$OBJDUMP" -d "$DLL" | grep -n -B14 "msr.*sp_el0" | head -60 || true

          echo "== callers of AllocatePages in this image =="
          "$OBJDUMP" -d "$DLL" | grep -n "bl.*AllocatePages" | head -5 || true

          echo "== ArchVectorConfig body =="
          AV=$(grep -iE "ArchVectorConfig" "$MAP" | head -1 | awk '{print $2}' || true)
          if [ -n "$AV" ]; then
            "$OBJDUMP" -d --start-address=0x$AV --stop-address=$((0x$AV + 0x120)) "$DLL" | tail -60
          fi

      - name: Build diagnostics
        if: steps.build.outcome != 'success'
        run: |
          LOG=$(ls Build/*/BUILDLOG*.txt Build/BUILDLOG.txt 2>/dev/null | head -1)
          echo "log=$LOG"
          [ -n "$LOG" ] || exit 0
          grep -nE 'INFO - .*(error|Error) F?[0-9]*:|undefined symbol|already defined' "$LOG" | tail -40 || true
          echo "=== tail ==="
          tail -60 "$LOG" || true

      - name: Collect firmware
        if: always()
        run: |
          mkdir -p dist
          find Build -type f -iname '*.fd' -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist
          for f in dist/*.fd; do [ -e "$f" ] || continue; shasum -a 256 "$f" | tee -a dist/SHA256SUMS.txt; done

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('dist/*') != ''
        with:
          name: uefi-firmware-${{ inputs.target || 'DEBUG' }}
          path: dist/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: |
            Build/BUILDLOG.txt
            Build/**/*.log
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
